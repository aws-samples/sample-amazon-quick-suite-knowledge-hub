AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Quick Resource Migrator - Bedrock AgentCore Runtime (MCP server) with Cognito
  machine-to-machine (client credentials) JWT authorization and VPC networking.
  Creates a Cognito user pool, resource server (with scope), and an app client
  WITH a generated client secret. The app client ID is wired into the runtime's
  AllowedClients. The client secret is retrieved by deploy.sh (CFN cannot output it).

# ═══════════════════════════════════════════════════════════════════
# PARAMETERS
# ═══════════════════════════════════════════════════════════════════
Parameters:
  RuntimeName:
    Type: String
    Default: quick_space_migrator
    Description: AgentCore Runtime name (pattern [a-zA-Z][a-zA-Z0-9_]{0,47}).
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,47}"

  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the deployment.zip code artifact.

  ArtifactKey:
    Type: String
    Default: quick-space-migrator/deployment.zip
    Description: S3 key of the deployment.zip code artifact.

  ArtifactVersionId:
    Type: String
    Default: ""
    Description: Optional S3 object VersionId to pin an exact artifact version.

  SourceRoleArn:
    Type: String
    Description: IAM role ARN in the SOURCE account the migrator assumes (read-only QuickSight + S3).

  TargetRoleArn:
    Type: String
    Description: IAM role ARN in the TARGET account the migrator assumes (read+write QuickSight + S3).

  ExecutionRoleArn:
    Type: String
    Description: >
      ARN of the AgentCore runtime execution role, created by cfn-runner-role.yaml
      (output ExecutionRoleArn). Deploy the runner-role stack FIRST.

  # ── Cognito ──
  CognitoDomainPrefix:
    Type: String
    Description: >
      Globally-unique Cognito hosted-UI domain prefix (lowercase letters,
      numbers, hyphens), e.g. "quick-migrator-dev-111122223333".
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"

  ResourceServerIdentifier:
    Type: String
    Default: quick-migrator
    Description: Cognito resource server identifier (becomes the scope prefix).

  ResourceServerScope:
    Type: String
    Default: invoke
    Description: Scope name on the resource server (full scope = <identifier>/<scope>).

  CallbackUrls:
    Type: CommaDelimitedList
    Default: "https://us-east-1.quicksight.aws.amazon.com/sn/oauthcallback"
    Description: >
      OAuth2 redirect/callback URL(s) for the 3LO (authorization_code) flow used
      by the Amazon Quick MCP connector. Must exactly match the redirect URI the
      connector sends.

  # ── Networking (VPC mode) ──
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs (>=2, in AgentCore-supported AZs) for the runtime ENIs.

  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group IDs for the runtime ENIs.

# ═══════════════════════════════════════════════════════════════════
# CONDITIONS
# ═══════════════════════════════════════════════════════════════════
Conditions:
  PinArtifactVersion: !Not [!Equals [!Ref ArtifactVersionId, ""]]

# ═══════════════════════════════════════════════════════════════════
# RESOURCES
# ═══════════════════════════════════════════════════════════════════
Resources:

  # ── Cognito user pool ──
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${RuntimeName}-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  # ── Resource server + custom scope (machine-to-machine) ──
  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !Ref ResourceServerIdentifier
      Name: !Sub "${RuntimeName}-resource-server"
      Scopes:
        - ScopeName: !Ref ResourceServerScope
          ScopeDescription: Permission to invoke the Quick Resource Migrator runtime.

  # ── Hosted-UI domain (required for the OAuth2 token endpoint) ──
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  # ── App client WITH a generated secret (3LO authorization_code flow) ──
  # Amazon Quick's MCP connector authenticates via the OAuth2 authorization_code
  # (3LO / per-user login) flow. The runtime authorizer validates the token's
  # client_id against AllowedClients, which a 3LO token from this client carries.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: !Sub "${RuntimeName}-m2m-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - !Sub "${ResourceServerIdentifier}/${ResourceServerScope}"
      CallbackURLs: !Ref CallbackUrls
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # ── AgentCore Runtime (VPC network mode + Cognito JWT inbound auth) ──
  MigratorRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Ref RuntimeName
      Description: Quick Resource Migrator MCP server (agents, connectors, knowledge bases).
      RoleArn: !Ref ExecutionRoleArn
      ProtocolConfiguration: MCP
      AgentRuntimeArtifact:
        CodeConfiguration:
          Runtime: PYTHON_3_14
          EntryPoint:
            - server.py
          Code:
            S3:
              Bucket: !Ref ArtifactBucket
              Prefix: !Ref ArtifactKey
              VersionId: !If [PinArtifactVersion, !Ref ArtifactVersionId, !Ref "AWS::NoValue"]
      EnvironmentVariables:
        SOURCE_ROLE_ARN: !Ref SourceRoleArn
        TARGET_ROLE_ARN: !Ref TargetRoleArn
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets: !Ref VpcSubnetIds
          SecurityGroups: !Ref VpcSecurityGroupIds
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration"
          AllowedClients:
            - !Ref UserPoolClient

# ═══════════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════════
Outputs:
  RuntimeArn:
    Description: AgentCore Runtime ARN.
    Value: !GetAtt MigratorRuntime.AgentRuntimeArn
  RuntimeId:
    Description: AgentCore Runtime ID.
    Value: !GetAtt MigratorRuntime.AgentRuntimeId
  UserPoolId:
    Description: Cognito user pool ID.
    Value: !Ref UserPool
  AppClientId:
    Description: Cognito app client ID (wired into AllowedClients).
    Value: !Ref UserPoolClient
  DiscoveryUrl:
    Description: OIDC discovery URL used by the runtime authorizer.
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration"
  TokenEndpoint:
    Description: OAuth2 token endpoint (authorization_code grant / 3LO).
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
  AuthorizeEndpoint:
    Description: OAuth2 authorize endpoint (3LO user login) for the Amazon Quick connector.
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize"
  OAuthScope:
    Description: Scopes to request in the authorization_code flow.
    Value: !Sub "openid email ${ResourceServerIdentifier}/${ResourceServerScope}"
  GetClientSecretCommand:
    Description: CLI to retrieve the app client secret (CFN cannot output it directly).
    Value: !Sub >-
      aws cognito-idp describe-user-pool-client --user-pool-id ${UserPool}
      --client-id ${UserPoolClient} --region ${AWS::Region}
      --query "UserPoolClient.ClientSecret" --output text
