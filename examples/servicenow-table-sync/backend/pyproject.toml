[project]
name = "service-now-ingestion-backend"
version = "0.1.0"
description = "ServiceNow → Amazon Quick ingestion — backend extraction services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "aws-lambda-powertools>=3.2,<4",
    "aws-xray-sdk>=2.0,<3",
    "boto3>=1.35,<2",
    # The one added library (user requirement): AWS SDK for pandas (awswrangler).
    # Used for the columnar Parquet write in the table extractor (wr.s3.to_parquet)
    # and, where it reduces boilerplate, the Iceberg staging read.
    "awswrangler>=3.9,<4",
    # ServiceNow's own Python client (Table + Attachment API) with OAuth and
    # transparent pagination/retry — used instead of hand-rolling HTTP, OAuth token
    # exchange, pagination, and record flattening.
    "pysnc[oauth]>=1.2,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "moto[s3]>=5.0,<6",
    "boto3-stubs[dynamodb,s3,secretsmanager]>=1.35,<2",
    "pandas-stubs>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # comprehensions
    "C901",        # mccabe complexity
    "ANN",         # missing type annotations
    "S",           # bandit security rules
    "PL",          # pylint
    "RUF",
]
ignore = [
    "ANN401",      # allow typing.Any in narrowly-scoped adapters
    "PLR0913",     # arg count governed by the request/response model rule instead
    "UP046",       # PEP-695 generics: TypeVar + Generic style matches the reference
    "UP047",       # PEP-695 generic functions: same reason as UP046
]
mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The public error contract's class names ARE the wire error-type values, so the
# N818 "Error suffix" rule would break the contract; scoped off for that module.
"src/common/errors.py" = ["N818"]
# The Glue job runs in the Spark environment where awsglue/pyspark objects are
# untyped; it is not part of the Lambda src tree. Relax annotation + naming rules
# that assume typed collaborators, and line length (Spark method chains run long).
# N816: the guarded-import fallback assigns to `getResolvedOptions` (mixedCase mirrors
# the awsglue API name). S608: the delete-apply builds `DELETE FROM ... WHERE sys_id IN`
# from trusted, single-quote-escaped ServiceNow audit ids (no external input) inside the Glue job.
"src/glue/*.py" = ["ANN001", "ANN201", "ANN202", "ANN205", "ANN206", "N802", "N803", "N806", "N816", "S608", "E501"]
# Test builders legitimately take many keyword args and use asserts.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ANN201", "ANN202", "ANN001", "PLR0917", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"
files = ["src"]
# The Glue Spark job runs only inside the Glue image against untyped awsglue/pyspark
# objects; it is packaged separately and excluded from the strict Lambda type check.
exclude = ["src/glue/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# awswrangler ships partial type information; relax missing-import for it and the
# Glue Spark runtime (awsglue/pyspark are only present in the Glue image). pysnc
# ships without inline types for strict mode.
[[tool.mypy.overrides]]
module = ["awswrangler.*", "awsglue.*", "pyspark.*", "pysnc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
