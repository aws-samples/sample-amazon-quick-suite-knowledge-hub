[project]
name = "service-now-simulator"
version = "0.1.0"
description = "Simulated ServiceNow REST API for end-to-end testing the ingestion pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    # Mangum adapts the ASGI app to API Gateway events for Lambda deployment.
    "mangum>=0.19,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "C901", "ANN", "S", "PL", "RUF"]
ignore = ["ANN401", "PLR0913", "PLR0917"]
mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ANN201", "ANN202", "ANN001", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"
files = ["src"]

# mangum ships without complete inline types for strict mode.
[[tool.mypy.overrides]]
module = ["mangum.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
