AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Quick Resource Migrator - AgentCore runtime execution role (CENTRAL/runner account).
  Deploy this FIRST. It creates the execution role the AgentCore runtime assumes,
  with permissions for logs, telemetry, Bedrock, EFS/S3Files mounts, ECR, the S3
  artifact bucket, and sts:AssumeRole into the source/target quick-space-agent-role.
  Its RoleArn is then referenced directly by the source/target role trust policies
  (cfn-quick-role.yaml) and by the runtime stack (cfn-agentcore-runtime.yaml).

# ═══════════════════════════════════════════════════════════════════
# PARAMETERS
# ═══════════════════════════════════════════════════════════════════
Parameters:
  RuntimeName:
    Type: String
    Default: quick_space_migrator
    Description: >
      AgentCore Runtime name. The execution role is named ${RuntimeName}-exec-role
      and the runtime stack must use the SAME RuntimeName so its RoleArn matches.
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,47}"

  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the deployment.zip code artifact (for S3 pull permissions).

  SourceRoleArn:
    Type: String
    Description: quick-space-agent-role ARN in the SOURCE account (for sts:AssumeRole).

  TargetRoleArn:
    Type: String
    Description: quick-space-agent-role ARN in the TARGET account (for sts:AssumeRole).

# ═══════════════════════════════════════════════════════════════════
# RESOURCES
# ═══════════════════════════════════════════════════════════════════
Resources:
  # ── Access-logs bucket for the backup bucket ──
  # S3 server access logging delivers to a SEPARATE bucket (a source bucket
  # logging into itself is discouraged). Encrypted, versioned, public access
  # blocked. This bucket logs ITSELF (S3 has no other bucket to point at without
  # infinite regress); a short-retention lifecycle rule bounds the self-log
  # growth so it never runs away.
  BackupAccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "quick-migrator-backups-logs-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      # Self-logging under a distinct prefix satisfies the access-logging rule;
      # the lifecycle rule below caps retention to prevent runaway growth.
      LoggingConfiguration:
        DestinationBucketName: !Sub "quick-migrator-backups-logs-${AWS::AccountId}"
        LogFilePrefix: self-access-logs/
      LifecycleConfiguration:
        Rules:
          - Id: expire-access-logs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # Allow the S3 logging service to deliver access logs into the logs bucket,
  # and enforce TLS-only access (scan: S3_BUCKET_SSL_REQUESTS_ONLY).
  BackupAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupAccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3ServerAccessLogsDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${BackupAccessLogsBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupAccessLogsBucket.Arn
              - !Sub "${BackupAccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ── Backup bucket (pre-update + post-migration snapshots of target resources) ──
  # Created in the runner/central account (where the MCP runtime executes) so the
  # runtime writes backups directly — no cross-account hop. Encrypted (SSE-S3),
  # versioned, public access blocked, access logs → the logs bucket above.
  BackupBucket:
    Type: AWS::S3::Bucket
    # Ensure the logs bucket's delivery policy exists before this bucket turns on
    # access logging into it (avoids a create-order race on log delivery).
    DependsOn: BackupAccessLogsBucketPolicy
    Properties:
      BucketName: !Sub "quick-migrator-backups-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      # Server access logging → dedicated logs bucket (scan: S3 bucket logging).
      LoggingConfiguration:
        DestinationBucketName: !Ref BackupAccessLogsBucket
        LogFilePrefix: backup-access-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # Enforce TLS-only access on the backup bucket (scan: S3_BUCKET_SSL_REQUESTS_ONLY).
  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ── Execution managed policy (per IaC standard: ManagedPolicy + ManagedPolicyArns) ──
  RuntimeExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RuntimeName}-exec-policy"
      Description: Execution permissions for the Quick Resource Migrator AgentCore runtime.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LogsGroupAndStreams
            Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:CreateLogGroup
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
          - Sid: LogsDescribeGroups
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
          - Sid: LogsPutEvents
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*"
          - Sid: XRayTelemetry
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource:
              - "*"
          - Sid: CloudWatchMetrics
            Effect: Allow
            Resource: "*"
            Action: cloudwatch:PutMetricData
            Condition:
              StringEquals:
                cloudwatch:namespace: bedrock-agentcore
          - Sid: BedrockModelInvocation
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - "arn:aws:bedrock:*::foundation-model/*"
              - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*"
          - Sid: EFSClientAccess
            Effect: Allow
            Action:
              - elasticfilesystem:ClientMount
              - elasticfilesystem:ClientWrite
            Resource: !Sub "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/*"
            Condition:
              ArnLike:
                elasticfilesystem:AccessPointArn: !Sub "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:access-point/*"
          - Sid: EFSDescribe
            Effect: Allow
            Action:
              - elasticfilesystem:DescribeAccessPoints
              - elasticfilesystem:DescribeMountTargets
            Resource:
              - !Sub "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/*"
              - !Sub "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:access-point/*"
          - Sid: S3FilesClientAccess
            Effect: Allow
            Action:
              - s3files:ClientMount
              - s3files:ClientWrite
              - s3files:ClientRootAccess
            Resource: !Sub "arn:aws:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*"
            Condition:
              ArnLike:
                s3files:AccessPointArn: !Sub "arn:aws:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*/access-point/*"
          - Sid: S3FilesDescribe
            Effect: Allow
            Action:
              - s3files:GetAccessPoint
              - s3files:ListMountTargets
            Resource:
              - !Sub "arn:aws:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*"
              - !Sub "arn:aws:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*/access-point/*"
          - Sid: AssumeQuickRoles
            Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Ref SourceRoleArn
              - !Ref TargetRoleArn
          - Sid: S3PullPermissions
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !Sub "arn:aws:s3:::${ArtifactBucket}"
              - !Sub "arn:aws:s3:::${ArtifactBucket}/*"
          - Sid: S3BackupPermissions
            # Write pre-update backups + list the asset folder to compute the
            # next version suffix (json_v1, json_v2, ...).
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
          - Sid: ECRPermissions
            Effect: Allow
            Action:
              - ecr:DescribeRepositories
              - ecr:DescribeImages
              - ecr:ListImages
            Resource:
              - "arn:aws:ecr:*:*:repository/*"

  # ── Execution role assumed by the AgentCore runtime ──
  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RuntimeName}-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      ManagedPolicyArns:
        - !Ref RuntimeExecutionPolicy

# ═══════════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════════
Outputs:
  ExecutionRoleArn:
    Description: >
      Runtime execution role ARN. Pass this as RunnerExecRoleArn to the
      source/target role stacks, and as ExecutionRoleArn to the runtime stack.
    Value: !GetAtt RuntimeExecutionRole.Arn

  ExecutionRoleName:
    Value: !Ref RuntimeExecutionRole

  BackupBucketName:
    Description: Bucket for pre-update resource backups (pass to the runtime stack as BackupBucket).
    Value: !Ref BackupBucket
