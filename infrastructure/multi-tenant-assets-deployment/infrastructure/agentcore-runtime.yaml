AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Quick asset migration - deploys the runtime that migrates Amazon Quick assets
  (agents, action connectors, and knowledge bases) between accounts.

# ═══════════════════════════════════════════════════════════════════
# PARAMETERS
# ═══════════════════════════════════════════════════════════════════
Parameters:
  RuntimeName:
    Type: String
    Default: quick_space_migrator
    Description: AgentCore Runtime name (pattern [a-zA-Z][a-zA-Z0-9_]{0,47}).
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,47}"

  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the deployment.zip code artifact.

  ArtifactKey:
    Type: String
    Default: quick-space-migrator/deployment.zip
    Description: S3 key of the deployment.zip code artifact.

  ArtifactVersionId:
    Type: String
    Default: ""
    Description: Optional S3 object VersionId to pin an exact artifact version.

  SourceRoleArn:
    Type: String
    Description: IAM role ARN in the SOURCE account the migrator assumes (read-only QuickSight + S3).

  TargetRoleArn:
    Type: String
    Description: IAM role ARN in the TARGET account the migrator assumes (read+write QuickSight + S3).

  ExecutionRoleArn:
    Type: String
    Description: >
      ARN of the AgentCore runtime execution role, created by cfn-runner-role.yaml
      (output ExecutionRoleArn). Deploy the runner-role stack FIRST.

  # ── Cognito ──
  CognitoDomainPrefix:
    Type: String
    Description: >
      Globally-unique Cognito hosted-UI domain prefix (lowercase letters,
      numbers, hyphens), e.g. "quick-migrator-dev-111122223333".
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"

  ResourceServerIdentifier:
    Type: String
    Default: quick-migrator
    Description: Cognito resource server identifier (becomes the scope prefix).

  ResourceServerScope:
    Type: String
    Default: invoke
    Description: Scope name on the resource server (full scope = <identifier>/<scope>).

  CallbackUrls:
    Type: CommaDelimitedList
    Default: "https://us-east-1.quicksight.aws.amazon.com/sn/oauthcallback"
    Description: >
      OAuth2 redirect/callback URL(s) for the 3LO (authorization_code) flow used
      by the Amazon Quick MCP connector. Must exactly match the redirect URI the
      connector sends.

  # ── Test user (3LO login) ──
  TestUsername:
    Type: String
    Default: migrator-test
    Description: Username of the Cognito test user created for the 3LO login flow.

  TestUserEmail:
    Type: String
    Default: migrator-test@example.com
    Description: Email attribute for the Cognito test user (marked verified).

  TestPassword:
    Type: String
    NoEcho: true
    Description: >
      Permanent password for the Cognito test user (>=12 chars, upper/lower/
      number/symbol). NoEcho keeps it out of CloudFormation console/events.

  # ── Networking (VPC mode) ──
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs (>=2, in AgentCore-supported AZs) for the runtime ENIs.

  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group IDs for the runtime ENIs.

# ═══════════════════════════════════════════════════════════════════
# CONDITIONS
# ═══════════════════════════════════════════════════════════════════
Conditions:
  PinArtifactVersion: !Not [!Equals [!Ref ArtifactVersionId, ""]]

# ═══════════════════════════════════════════════════════════════════
# RESOURCES
# ═══════════════════════════════════════════════════════════════════
Resources:
  # ── Cognito user pool ──
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${RuntimeName}-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  # ── Resource server + custom scope (machine-to-machine) ──
  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !Ref ResourceServerIdentifier
      Name: !Sub "${RuntimeName}-resource-server"
      Scopes:
        - ScopeName: !Ref ResourceServerScope
          ScopeDescription: Permission to invoke the Quick Resource Migrator runtime.

  # ── Hosted-UI domain (required for the OAuth2 token endpoint) ──
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  # ── App client WITH a generated secret (3LO authorization_code flow) ──
  # Amazon Quick's MCP connector authenticates via the OAuth2 authorization_code
  # (3LO / per-user login) flow. The runtime authorizer validates the token's
  # client_id against AllowedClients, which a 3LO token from this client carries.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: !Sub "${RuntimeName}-m2m-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - !Sub "${ResourceServerIdentifier}/${ResourceServerScope}"
      CallbackURLs: !Ref CallbackUrls
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # ── Custom resource: expose the generated app-client secret ──
  # CloudFormation cannot return a Cognito app-client secret via GetAtt
  # (AWS::Cognito::UserPoolClient exposes ClientSecret in the docs but the
  # attribute does not resolve). A small Lambda-backed custom resource reads it
  # from the Cognito API so it can be surfaced as a stack output.
  CognitoHelperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cognito-helper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeThisAppClient
                Effect: Allow
                Action: cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt UserPool.Arn
              - Sid: ManageTestUser
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminGetUser
                Resource: !GetAtt UserPool.Arn
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

  CognitoHelperFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Cognito custom-resource helper — reads the app-client secret and manages the test user.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      ReservedConcurrentExecutions: 1
      Role: !GetAtt CognitoHelperRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          cognito = boto3.client("cognito-idp")

          def _read_secret(props):
              resp = cognito.describe_user_pool_client(
                  UserPoolId=props["UserPoolId"],
                  ClientId=props["ClientId"],
              )
              return {"ClientSecret": resp["UserPoolClient"].get("ClientSecret", "")}

          def _upsert_user(props):
              pool = props["UserPoolId"]
              username = props["Username"]
              # Create the user if it does not already exist (idempotent).
              try:
                  cognito.admin_create_user(
                      UserPoolId=pool,
                      Username=username,
                      UserAttributes=[
                          {"Name": "email", "Value": props["Email"]},
                          {"Name": "email_verified", "Value": "true"},
                      ],
                      MessageAction="SUPPRESS",
                  )
              except cognito.exceptions.UsernameExistsException:
                  pass
              # Set (or reset) the permanent password so login needs no reset.
              cognito.admin_set_user_password(
                  UserPoolId=pool,
                  Username=username,
                  Password=props["Password"],
                  Permanent=True,
              )
              return {"Username": username}

          def _build_endpoint(props):
              # AgentCore MCP invocations URL: the runtime ARN is URL-encoded
              # into the path (': ' -> %3A, '/' -> %2F).
              import urllib.parse
              arn = props["RuntimeArn"]
              region = props["Region"]
              encoded = urllib.parse.quote(arn, safe="")
              url = (
                  f"https://bedrock-agentcore.{region}.amazonaws.com"
                  f"/runtimes/{encoded}/invocations?qualifier=DEFAULT"
              )
              return {"McpEndpoint": url}

          def handler(event, context):
              props = event.get("ResourceProperties", {})
              action = props.get("Action")
              try:
                  if event["RequestType"] == "Delete":
                      if action == "manage-user":
                          try:
                              cognito.admin_delete_user(
                                  UserPoolId=props["UserPoolId"],
                                  Username=props["Username"],
                              )
                          except Exception:
                              pass
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  if action == "read-secret":
                      data = _read_secret(props)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, data, noEcho=True)
                  elif action == "manage-user":
                      data = _upsert_user(props)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, data)
                  elif action == "build-endpoint":
                      data = _build_endpoint(props)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, data)
                  else:
                      raise ValueError(f"Unknown Action: {action}")
              except Exception as exc:  # surface the failure to CloudFormation
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED,
                      {"Error": str(exc)},
                  )

  AppClientSecretCR:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt CognitoHelperFunction.Arn
      Action: read-secret
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      # Force a re-read whenever the client changes.
      ClientVersion: !Ref UserPoolClient

  TestUser:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt CognitoHelperFunction.Arn
      Action: manage-user
      UserPoolId: !Ref UserPool
      Username: !Ref TestUsername
      Email: !Ref TestUserEmail
      Password: !Ref TestPassword

  # ── Build the AgentCore MCP invocations endpoint URL (runtime ARN URL-encoded) ──
  McpEndpoint:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt CognitoHelperFunction.Arn
      Action: build-endpoint
      RuntimeArn: !GetAtt MigratorRuntime.AgentRuntimeArn
      Region: !Ref "AWS::Region"

  # ── AgentCore Runtime (VPC network mode + Cognito JWT inbound auth) ──
  MigratorRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Ref RuntimeName
      Description: Quick Resource Migrator MCP server (agents, connectors, knowledge bases).
      RoleArn: !Ref ExecutionRoleArn
      ProtocolConfiguration: MCP
      AgentRuntimeArtifact:
        CodeConfiguration:
          Runtime: PYTHON_3_14
          EntryPoint:
            - server.py
          Code:
            S3:
              Bucket: !Ref ArtifactBucket
              Prefix: !Ref ArtifactKey
              VersionId: !If [PinArtifactVersion, !Ref ArtifactVersionId, !Ref "AWS::NoValue"]
      EnvironmentVariables:
        SOURCE_ROLE_ARN: !Ref SourceRoleArn
        TARGET_ROLE_ARN: !Ref TargetRoleArn
        # AgentCore delivers requests from outside the container's loopback, so
        # the server must listen on all interfaces in the runtime. The code
        # defaults to 127.0.0.1 for local use; the runtime opts in explicitly.
        BIND_HOST: "0.0.0.0"
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets: !Ref VpcSubnetIds
          SecurityGroups: !Ref VpcSecurityGroupIds
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration"
          AllowedClients:
            - !Ref UserPoolClient

# ═══════════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════════
Outputs:
  RuntimeArn:
    Description: AgentCore Runtime ARN.
    Value: !GetAtt MigratorRuntime.AgentRuntimeArn
  McpEndpoint:
    Description: AgentCore MCP invocations endpoint URL (register this in the Amazon Quick connector).
    Value: !GetAtt McpEndpoint.McpEndpoint
  RuntimeId:
    Description: AgentCore Runtime ID.
    Value: !GetAtt MigratorRuntime.AgentRuntimeId
  UserPoolId:
    Description: Cognito user pool ID.
    Value: !Ref UserPool
  AppClientId:
    Description: Cognito app client ID (wired into AllowedClients).
    Value: !Ref UserPoolClient
  ClientSecret:
    Description: Cognito app client secret (read via custom resource; sensitive).
    Value: !GetAtt AppClientSecretCR.ClientSecret
  TestUsername:
    Description: Cognito test user for the 3LO login flow.
    Value: !Ref TestUsername
  TestPassword:
    Description: Cognito test user password (sensitive).
    Value: !Ref TestPassword
  DiscoveryUrl:
    Description: OIDC discovery URL used by the runtime authorizer.
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration"
  TokenEndpoint:
    Description: OAuth2 token endpoint (authorization_code grant / 3LO).
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
  AuthorizeEndpoint:
    Description: OAuth2 authorize endpoint (3LO user login) for the Amazon Quick connector.
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize"
  OAuthScope:
    Description: Scopes to request in the authorization_code flow.
    Value: !Sub "openid email ${ResourceServerIdentifier}/${ResourceServerScope}"
