name: Quality Check

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "pyproject.toml"
      - "mkdocs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "pyproject.toml"
      - "mkdocs.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  full-quality-gate:
    name: Full Quality Gate (make check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Amazon Quick Knowledge Hub
        uses: actions/checkout@v4
        with:
          # gitleaks (in `make check`) scans the working tree; fetch full
          # history so secret scanning has complete context.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js (for Prettier)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v3

      - name: Install project dependencies
        run: uv sync --dev

      - name: Install pinned tooling (gitleaks + Prettier)
        run: uv run install

      - name: Run full quality gate
        # Single source of truth for quality + docs checks: ruff (lint +
        # format), mdformat, Prettier, gitleaks, typos, and mkdocs build
        # (non-strict) — identical to what developers run locally via
        # `make check`. Bandit + Safety + TruffleHog secret scanning live in
        # security-scan.yml, so they are intentionally not duplicated here.
        run: make check

      - name: Documentation server smoke test
        # `make check` builds the site; this additionally confirms the served
        # home page responds (catches serve-time/runtime issues a build misses).
        # site_url has a subpath, so `/` 302-redirects to it — use -L to follow.
        run: |
          echo "🧪 Testing documentation server..."
          uv run mkdocs serve -f mkdocs.yml --dev-addr=127.0.0.1:8000 &
          sleep 5
          curl -fL http://127.0.0.1:8000/ || exit 1
          pkill -f "mkdocs serve" || true
