# gitleaks configuration
# Extends the built-in default ruleset, then allowlists known documentation
# false positives (illustrative OAuth/OIDC examples that use placeholders, not
# real credentials).
#
# See: https://github.com/gitleaks/gitleaks#configuration

# Inherit all of gitleaks' default rules.
[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and illustrative token examples (not real secrets)"

# Files that contain only illustrative OAuth/OIDC token examples and CDK output
# placeholders. These are docs, not runtime code or config.
paths = [
  '''integration/actions/MCP/testing-mcp-oauth-flow/mcp_3LO_auth_flow\.md''',
  '''examples/document-generation-mcp-agentcore-runtime/README\.md''',
]

# Also allowlist the specific placeholder strings anywhere they appear, so a new
# doc reusing the same examples does not re-trip the generic-api-key rule.
regexes = [
  '''<ACCESS_TOKEN_JWT>''',
  '''<YOUR_CLIENT_ID>''',
  '''eyJhbGciOiJSUzI1NiJ9\.\.\.''',
  '''abc123def456\.\.\.''',
]
