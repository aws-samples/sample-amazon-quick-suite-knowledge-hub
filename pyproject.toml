[project]
name = "amazon-quick-knowledge-hub"
version = "1.0.0"
description = "Integration guides and documentation for Amazon Quick"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs-material>=9.7.0",
    "pymdown-extensions>=10.7.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.8",
    "bandit[toml]>=1.7.5",
    "safety>=3.0.0",
    "pbr>=6.0.0",
    "pre-commit>=3.6.0",
    # One-command build/fix runner (scripts/build.py, scripts/install.py)
    "click>=8,<9",
    "loguru>=0.7,<1",
    "pydantic>=2,<3",
    "mdformat>=1,<2",
    "mdformat-gfm>=1,<2",
    "mdformat-frontmatter>=2,<3",
    "typos>=1.49,<2",
]

# uv reads dev dependencies from this group as well. Keep in sync with the
# dev extra above so `uv sync --dev` and `pip install .[dev]` match.
[dependency-groups]
dev = [
    "ruff>=0.1.8",
    "bandit[toml]>=1.7.5",
    "safety>=3.0.0",
    "pbr>=6.0.0",
    "pre-commit>=3.6.0",
    "click>=8,<9",
    "loguru>=0.7,<1",
    "pydantic>=2,<3",
    "mdformat>=1,<2",
    "mdformat-gfm>=1,<2",
    "mdformat-frontmatter>=2,<3",
    "typos>=1.49,<2",
]

# One-command developer workflow. Run any of these with `uv run <name>`:
#   uv run install   -> fetch pinned gitleaks + npm ci (Prettier)
#   uv run build      -> all quality/security checks
#   uv run fix        -> auto-fix what is fixable
#   uv run docs-build -> mkdocs build --strict
#   uv run docs-serve -> live docs preview
[project.scripts]
install = "scripts.install:main"
build = "scripts.build:cli"
fix = "scripts.build:fix"
docs-build = "scripts.build:docs"
docs-serve = "scripts.build:docs_serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["README.md", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".venv/",
    ".ruff_cache/",
    ".tools/",
    "node_modules/",
    "site/",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # flake8-bandit security rules, reimplemented by Ruff
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# scripts/ is build and release tooling, so shelling out is its whole job.
# Every command it runs is a literal defined in this repo, never user input.
# Keeping these scoped here means the S rules stay fully active for any
# application Python added later.
"scripts/*" = [
    "S310", # urlopen: install.py rejects any URL that isn't https
    "S602", # shell=True: commands come from the TOOLS table, not input
    "S603", # subprocess without shell: this is the safer form
    "S607", # partial executable path: mkdocs, npx, git resolve from PATH
]
# The docs build hook shells out to git to read commit dates for the featured
# card ordering. The command is a fixed literal (no user input) and git is
# resolved from PATH — both are intentional and safe here.
"docs/hooks/*" = ["S603", "S607"]
# Jupyter notebooks are interactive tutorials: variables are defined across
# cells (so ruff sees them as undefined/unused), demo HTTP calls skip timeouts,
# and asserts are used for teaching. These are inherent to notebook samples.
"*.ipynb" = ["S101", "S113", "F821", "F841"]
# Test suites legitimately use assert; S105 flags label strings, not secrets.
"**/tests/**" = ["S101", "S105"]
"**/test_*.py" = ["S101", "S105"]
# Synthetic data generators / sample-data scripts use non-crypto randomness by
# design (fake demo data), and build demo SQL from trusted literals.
"**/data-generators/*" = ["S311"]
"**/generate_*.py" = ["S311"]
"examples/genai-operations-hub/infrastructure/*" = ["S311", "S608"]
# S105 flags constant *names* containing words like TOKEN/PASSWORD/token_use —
# these are event-type/label strings, not credentials. F821 `context` is a
# guarded `if "context" in locals()` probe ruff can't resolve. S311 builds a
# non-crypto request id. S104 binds all interfaces for the container runtime.
"integration/actions/MCP/gateway-agentcore-s3-crud-mcp/src/*" = [
    "S105",
    "S311",
    "F821",
]
"amazon-quick-on-desktop/scripts/sync_users.py" = ["S105"]  # Cognito status label
# MCP servers bind all interfaces inside their container runtime by design.
"integration/actions/MCP/custom-mcp-server-agentcore-runtime/hr_mcp_server.py" = [
    "S104",
]
# Demo/sample code: /tmp on Lambda, trusted-literal subprocess, demo HTTP calls.
"examples/compliance-assistant-mcp/runtime/agent.py" = ["S108"]
"examples/genai-operations-hub/infrastructure/data-generators/generate_all_data.py" = [
    "S603",
]
"integration/actions/MCP/custom-mcp-server-agentcore-gateway/utils.py" = ["S113"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", "node_modules"]
skips = ["B101"] # Skip assert_used test

[tool.typos.files]
extend-exclude = [
    ".tools/",
    ".venv/",
    "node_modules/",
    "site/",
    ".cache/",
    "tmp/",
    "docs/infrastructure/",
    "docs/integration/",
    "docs/examples/",
    "docs/amazon-quick-on-desktop/",
    "uv.lock",
    "package-lock.json",
    # Synthetic demo datasets: US state codes (ND, VA...), place names and
    # street addresses trip the spell checker but are intentional sample data.
    "*.csv",
]

[tool.typos.default.extend-words]
# Legitimate abbreviations / identifiers that are not typos.
ND = "ND"        # North Dakota (and other 2-letter state/label codes)
BA = "BA"
ue = "ue"
CAF = "CAF"
EDE = "EDE"
DBE = "DBE"
AFE = "AFE"
DAA = "DAA"
ABD = "ABD"
Ser = "Ser"
Mata = "Mata"
Damon = "Damon"
Shepard = "Shepard"
Villegas = "Villegas"
observ = "observ"    # tag-match substring for "observability", not a typo
